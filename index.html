<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>学习手册</title>
    <link rel="stylesheet" href="style.css?v=16" />
  </head>
  <body class="hub-page">
    <a class="skip-link" href="#hub">跳到主题</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <div class="header-top">
          <div class="title-line">
            <h1>学习手册</h1>
            <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
              <button type="button" data-lang="zh" aria-pressed="true">中</button>
              <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
          </div>
        </div>
        <p class="lede">先选一个主题。现在 Linux 和线性代数可用。</p>
        <label class="search-wrap">
          <span class="visually-hidden">搜索手册</span>
          <input
            id="search"
            type="search"
            placeholder="copy, 复制  或  linear combination"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
      </div>
    </header>

    <main id="hub-results" class="results wrap" hidden></main>
    <p class="empty wrap" id="empty" hidden>没有匹配。试 copy / 多项式 / :q!</p>

    <main id="hub" class="hub wrap">
      <a class="tile tile-live" href="linux.html">
        <h2 id="tile-linux-title">Linux 命令手册</h2>
        <p id="tile-linux-hint" class="tile-hint">打开手册</p>
      </a>
      <a class="tile tile-live tile-linear" href="linear.html">
        <h2 id="tile-linear-title">线性代数手册</h2>
        <p id="tile-linear-hint" class="tile-hint">打开手册</p>
      </a>
      <a class="tile tile-live tile-github" href="github.html">
        <h2 id="tile-github-title">GitHub 入门手册</h2>
        <p id="tile-github-hint" class="tile-hint">打开手册</p>
      </a>
      <a class="tile tile-live" href="enter.html">
        <h2 id="tile-enter-title">进出手册</h2>
        <p id="tile-enter-hint" class="tile-hint">进入 / 退出 / 卡住 · PATH 与配置</p>
      </a>
      <a class="tile tile-live tile-sql" href="sql.html">
        <h2 id="tile-sql-title">数据库入门</h2>
        <p id="tile-sql-hint" class="tile-hint">用 notes.db 学 SQL · 浏览器可试</p>
      </a>
      <div class="tile tile-soon" aria-disabled="true">
        <h2>Grok</h2>
        <p class="soon">稍后</p>
      </div>
      <div class="tile tile-soon" aria-disabled="true">
        <h2>Julia</h2>
        <p class="soon">稍后</p>
      </div>
      <div class="tile tile-soon" aria-disabled="true">
        <h2>R</h2>
        <p class="soon">稍后</p>
      </div>
      <div class="tile tile-soon" aria-disabled="true">
        <h2>Notebook</h2>
        <p class="soon">稍后</p>
      </div>
    </main>
    <script src="search-aliases.js"></script>
    <script src="search.js?v=2"></script>
    <script src="data.js"></script>
    <script src="linear-data.js"></script>
    <script src="enter-data.js"></script>
    <script src="github-data.js"></script>
    <script src="sql-data.js"></script>
    <script src="app.js?v=15"></script>
  </body>
</html>
