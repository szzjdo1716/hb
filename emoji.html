<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>日常表情</title>
    <link rel="stylesheet" href="style.css?v=17" />
    <style>
      .emoji-page .cmd[data-slug="faces"] { border-top-color: #fbbf24; }
      .emoji-page .cmd[data-slug="hearts"] { border-top-color: #fb7185; }
      .emoji-page .cmd[data-slug="hands"] { border-top-color: #38bdf8; }
      .emoji-page .cmd[data-slug="people"] { border-top-color: #a78bfa; }
      .emoji-page .cmd[data-slug="objects"] { border-top-color: #22d3ee; }
      .emoji-page .cmd[data-slug="symbols"] { border-top-color: #94a3b8; }
      .emoji-page .cmd[data-slug="food"] { border-top-color: #fb923c; }
      .emoji-page .cmd[data-slug="animals"] { border-top-color: #34d399; }
      .lex-page .cmd-head code,
      .lex-page .sum,
      .lex-page .sample-line {
        white-space: normal;
        overflow-wrap: anywhere;
      }
      .lex-glyph {
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: 1.45rem;
        line-height: 1;
        margin-right: 0.35rem;
      }
      .lex-page .sample-line {
        margin: 0.4rem 0;
        padding: 0.55rem 0.75rem;
        background: #020617;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .lex-page .cmd-body p { margin: 0.35rem 0; }
      .lex-page .care { color: var(--muted); }
    </style>
  </head>
  <body class="lex-page emoji-page" data-book="emoji">
    <a class="skip-link" href="#results">跳到表情</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <div class="header-top">
          <p class="nav-home"><a href="index.html" id="home-link">首页</a></p>
          <div class="title-line">
            <h1 id="page-title">日常表情</h1>
            <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
              <button type="button" data-lang="zh" aria-pressed="true">中</button>
              <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
          </div>
        </div>
        <p class="lede" id="lede">300 个日常表情。字形、英文名、中文、意思、两句例子、分类。</p>
        <label class="search-wrap">
          <span class="visually-hidden" id="search-label">搜索表情</span>
          <input
            id="search"
            type="search"
            placeholder="😂, 笑哭, heart"
            autocomplete="off"
            spellcheck="false"
          />
          <p class="search-hint" id="search-hint">中文或英文都可以。</p>
        </label>
        <div class="toolbar" id="toolbar">
          <button type="button" class="chip-toggle cat-toggle" id="chip-toggle" aria-expanded="false" aria-controls="categories">分类 ▾</button>
          <nav id="categories" class="chips" aria-label="分类"></nav>
          <p class="status" id="status"></p>
        </div>
      </div>
    </header>

    <main id="results" class="results wrap" aria-live="polite"></main>
    <p class="empty wrap" id="empty" hidden>没有匹配。试 😂 / 笑哭 / heart</p>

    <footer class="site-footer wrap">
      <p id="footer">只收这 300 个日常表情。</p>
    </footer>

    <script src="search-aliases.js"></script>
    <script src="search.js?v=2"></script>
    <script src="emoji-data.js"></script>
    <script src="lexicon-page.js"></script>
  </body>
</html>
