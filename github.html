<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>GitHub 入门手册</title>
    <link rel="stylesheet" href="style.css?v=11" />
  </head>
  <body class="github-page">
    <a class="skip-link" href="#results">跳到命令列表</a>

    <header class="site-header">
      <div class="header-inner">
        <div class="header-top">
          <p class="nav-home"><a href="index.html" id="home-link">首页</a></p>
          <div class="title-line">
            <h1>GitHub 入门手册</h1>
            <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
              <button type="button" data-lang="zh" aria-pressed="true">中</button>
              <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
          </div>
        </div>
        <p class="lede">
          从本机 git 到 GitHub 网页、Pages、iPad 编辑。搜索命令名或主题词即可。打开本页后无需联网（文档链接除外）。
        </p>
        <label class="search-wrap">
          <span class="visually-hidden">搜索命令</span>
          <input
            id="search"
            type="search"
            placeholder="输入 git status、push、pages、pr …"
            autocomplete="off"
            spellcheck="false"
          />
          <p class="search-hint" id="search-hint">
            只输入命令名或主题名时，只显示这一条。
          </p>
        </label>
      </div>
      <div class="toolbar" id="toolbar">
        <button type="button" class="chip-toggle" id="chip-toggle" aria-expanded="false" aria-controls="categories">分类 ▾</button>
        <nav id="categories" class="chips" aria-label="分类"></nav>
        <p class="status" id="status">正在加载 SQLite…</p>
      </div>
    </header>

    <main id="results" class="results" aria-live="polite"></main>

    <p class="empty" id="empty" hidden>没有匹配的命令。</p>

    <footer class="site-footer">
      <p>
        查询在你的电脑上用 SQLite（sql.js）完成。docs.github.com 链接需要联网。Grok Build CLI 不能在 iPad 上运行。
      </p>
    </footer>

    <script src="vendor/sql-wasm.js"></script>
    <script src="vendor/sql-wasm-binary.js"></script>
    <script src="github-data.js"></script>
    <script src="app.js?v=10"></script>
  </body>
</html>
