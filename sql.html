<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>数据库入门</title>
    <link rel="stylesheet" href="enter.css?v=8" />
    <style>
      .sql-page .cmd[data-cat="concept"] { border-top-color: #38bdf8; }
      .sql-page .cmd[data-cat="write"] { border-top-color: #fb923c; }
      .sql-page .cmd[data-cat="query"] { border-top-color: #34d399; }
      .sql-page .cmd[data-cat="structure"] { border-top-color: #a78bfa; }
      .sql-page .cmd[data-cat="tools"] { border-top-color: #f472b6; }
      .playground {
        max-width: 52rem;
        margin: 0 auto;
        padding: 0.85rem 1.25rem 1.1rem;
        box-sizing: border-box;
      }
      .playground h2 {
        margin: 0 0 0.45rem;
        font-size: 0.78rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .playground textarea {
        display: block;
        width: 100%;
        min-height: 6.5rem;
        font-family: var(--mono);
        font-size: 16px;
        line-height: 1.45;
        padding: 0.7rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #020617;
        color: var(--text);
        resize: vertical;
      }
      .play-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.55rem 0;
      }
      .play-actions button,
      .try-btn {
        font: inherit;
        font-weight: 650;
        min-height: 44px;
        padding: 0.45rem 0.9rem;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      #sql-run,
      .try-btn {
        background: #38bdf8;
        color: #0f172a;
      }
      #sql-reset {
        background: var(--bg-raised);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .sql-out {
        overflow-x: auto;
        max-width: 100%;
      }
      .sql-out table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .sql-out th,
      .sql-out td {
        text-align: left;
        padding: 0.4rem 0.5rem 0.4rem 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .sql-out th { color: var(--muted); }
      .sql-msg { color: var(--muted); margin: 0.4rem 0 0; }
      .sql-err { color: #fda4af; margin: 0.4rem 0 0; }
      .try-btn {
        display: inline-flex;
        align-items: center;
        margin-top: 0.55rem;
      }
    </style>
  </head>
  <body class="enter-page sql-page view-list">
    <a class="skip-link" href="#results">跳到卡片列表</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <div class="header-top">
          <p class="nav-home">
            <a href="index.html" id="home-link" class="list-only">首页</a>
            <a href="sql.html" id="header-back" class="detail-only">返回列表</a>
          </p>
          <div class="title-line">
            <h1 id="page-title">数据库入门</h1>
            <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
              <button type="button" data-lang="zh" aria-pressed="true">中</button>
              <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
          </div>
        </div>
        <p class="lede" id="lede">用 notes.db 学 SQL。浏览器里可以试，本机用 sqlite3 或 DB Browser。</p>
        <label class="search-wrap list-only">
          <span class="visually-hidden" id="search-label">搜索</span>
          <input
            id="search"
            type="search"
            placeholder="copy, 复制  或  linear combination"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <div class="toolbar list-only" id="toolbar">
          <button type="button" class="chip-toggle cat-toggle" id="chip-toggle" aria-expanded="false" aria-controls="categories">分类 ▾</button>
          <nav id="categories" class="chips" aria-label="分类"></nav>
          <p class="status" id="status"></p>
        </div>
      </div>
    </header>

    <section class="playground" id="playground">
      <h2 id="play-title">试一试 notes.db</h2>
      <textarea id="sql-input" spellcheck="false">SELECT * FROM notes;</textarea>
      <div class="play-actions">
        <button type="button" id="sql-run">运行</button>
        <button type="button" id="sql-reset">重置</button>
      </div>
      <div class="sql-out" id="sql-out"></div>
      <p class="sql-err" id="sql-fallback" hidden>用 Terminal sqlite3</p>
    </section>

    <main id="results" class="results wrap list-only" aria-live="polite"></main>
    <p class="empty wrap list-only" id="empty" hidden>没有匹配。试 join / 连接 / select</p>

    <div id="detail" class="detail-wrap wrap detail-only" hidden></div>

    <footer class="site-footer">
      <p id="footer">
        本页为原创教学例子，不是任何书籍的摘录。
        <a href="https://sqlite.org/cli.html" target="_blank" rel="noopener noreferrer">sqlite.org/cli.html</a>
        ·
        <a href="https://sqlitebrowser.org/" target="_blank" rel="noopener noreferrer">sqlitebrowser.org</a>
      </p>
    </footer>

    <script src="vendor/sql-wasm.js"></script>
    <script src="vendor/sql-wasm-binary.js"></script>
    <script src="search-aliases.js"></script>
    <script src="search.js?v=2"></script>
    <script src="sql-data.js"></script>
    <script src="sql-book.js"></script>
  </body>
</html>
